<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MITEKAU｜暮らしの買いものメモ</title>
  <meta name="description" content="買う前に、ちょっと確認。ガジェット・日用品・小型家電を中心に、注目の商品を見つけやすく整理するMITEKAUの公式ページです。">

  <style>
    :root {
      --navy: #172033;
      --blue: #6685a6;
      --cream: #f4ead7;
      --paper: #fffdf8;
      --muted: #667085;
      --line: #e8e2d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--navy);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Yu Gothic", sans-serif;
      line-height: 1.75;
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 64px 24px 48px;
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      margin-bottom: 18px;
      border-radius: 999px;
      background: var(--cream);
      font-size: 13px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 72px);
      letter-spacing: .05em;
    }

    .concept {
      margin: 0 0 42px;
      color: var(--muted);
      font-size: 19px;
    }

    .card {
      margin: 22px 0;
      padding: 28px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(23, 32, 51, .05);
    }

    .lead {
      margin-top: 0;
      font-size: 23px;
      font-weight: 700;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    a {
      color: #425f84;
      font-weight: 700;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <span class="badge">暮らしの買いものメモ</span>

    <h1>MITEKAU</h1>
    <p class="concept">買う前に、ちょっと確認。</p>

    <section class="card">
      <p class="lead">気になる商品を、見つけやすく。</p>
      <p>
        ガジェット、便利グッズ・日用品、小型家電を中心に、
        売れている・注目されている商品を確認しやすい形で紹介します。
      </p>
    </section>

    <section class="card">
      <h2>Threads</h2>
      <p>最新の商品情報はMITEKAUのThreadsで発信します。</p>
      <p>
        <a href="https://www.threads.com/@mitekau"
           rel="me noopener">
          MITEKAU @mitekau
        </a>
      </p>
    </section>

    <footer>
      当ページおよびMITEKAUの投稿には、
      広告・アフィリエイトリンクを含む場合があります。
      価格・在庫・商品情報は変更される場合があるため、
      購入前にリンク先の最新情報をご確認ください。
    </footer>
  </main>
</body>
</html>
